[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlora-airbnb"
version = "0.1.2"
description = "Crawlora Airbnb API client with 7 endpoints for listing search, room details, calendars and reviews, and host profiles, listings and reviews"
readme = "README.md"
keywords = ["crawlora", "api-client", "sdk", "web-scraping", "scraping-api", "airbnb", "airbnb-api", "airbnb-scraper", "airbnb-data", "airbnb-listing-search", "airbnb-room-details", "airbnb-calendars-reviews", "airbnb-host-profiles", "airbnb-listings-reviews"]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Crawlora" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Typing :: Typed",
]
dependencies = ["typing-extensions>=4.7; python_version < '3.11'"]

[project.optional-dependencies]
async = ["httpx>=0.27"]
test = ["mypy>=1.11", "pytest>=8"]

[project.urls]
Homepage = "https://crawlora.net/?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=airbnb-python-homepage"
Documentation = "https://crawlora.net/docs?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=airbnb-python-api-docs"
Repository = "https://github.com/Crawlora-org/crawlora-airbnb"

[tool.setuptools.packages.find]
where = ["."]
include = ["crawlora_airbnb"]

[tool.setuptools.package-data]
"crawlora_airbnb" = ["py.typed", "*.pyi"]
